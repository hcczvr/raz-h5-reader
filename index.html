<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RAZ 点读绘本馆</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      background-color: #f0f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .header-bar {
      width: 100%;
      max-width: 600px;
      padding: 10px 15px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e5e7eb;
      z-index: 10;
    }

    .book-select {
      width: 100%;
      padding: 8px 12px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      background-color: #f9fafb;
      color: #111827;
      outline: none;
    }

    .swiper {
      width: 100%;
      height: calc(100% - 60px);
      max-width: 600px;
      max-height: 850px;
      background: #ffffff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .swiper-slide {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      cursor: pointer;
    }

    .swiper-slide img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .swiper-pagination {
      font-size: 14px;
      color: #666;
      bottom: 10px !important;
    }
  </style>
</head>

<body>

  <div class="header-bar">
    <select id="book-select" class="book-select" onchange="switchBook(this.value)">
      <option value="">加载绘本列表中...</option>
    </select>
  </div>

  <div class="swiper">
    <div class="swiper-wrapper" id="swiper-wrapper"></div>
    <div class="swiper-pagination"></div>
  </div>

  <audio id="global-audio"></audio>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    let allBooks = [];
    let currentBook = null;
    let mySwiper = null;
    const audioPlayer = document.getElementById('global-audio');

    // 加上时间戳 ?t=... 强制绕过浏览器与 CDN 缓存
    fetch('https://media.ifreedu.cn/config.json?t=' + Date.now())
      .then(response => response.json())
      .then(data => {
        allBooks = Array.isArray(data) ? data : [data];
        renderSelectMenu();
        if (allBooks.length > 0) {
          loadBook(0);
        }
      })
      .catch(err => console.error('加载 config.json 失败:', err));

    function renderSelectMenu() {
      const selectEl = document.getElementById('book-select');
      selectEl.innerHTML = allBooks.map((book, idx) => `
        <option value="${idx}">${book.title}</option>
      `).join('');
    }

    function switchBook(index) {
      if (index === "" || !allBooks[index]) return;
      loadBook(parseInt(index));
    }

    function loadBook(index) {
      currentBook = allBooks[index];
      document.title = currentBook.title;

      const wrapper = document.getElementById('swiper-wrapper');
      wrapper.innerHTML = currentBook.pages.map((p, pIdx) => `
        <div class="swiper-slide" onclick="playAudioOfPage(${pIdx})">
          <img src="${p.image}" alt="Page ${p.page}" />
        </div>
      `).join('');

      if (mySwiper) mySwiper.destroy(true, true);

      mySwiper = new Swiper('.swiper', {
        pagination: { el: '.swiper-pagination', type: 'fraction' },
        on: {
          slideChange: function () {
            playAudioOfPage(this.activeIndex);
          }
        }
      });

      playAudioOfPage(0);
    }

    function playAudioOfPage(index) {
      if (!currentBook || !currentBook.pages[index]) return;
      const audioUrl = currentBook.pages[index].audio;
      if (!audioUrl) return;

      audioPlayer.src = audioUrl;
      audioPlayer.play().catch(() => {
        console.log('自动播放被阻止，请点击屏幕交互。');
      });
    }
  </script>
</body>

</html>
